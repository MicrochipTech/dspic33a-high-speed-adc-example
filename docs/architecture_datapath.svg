<text class="s" x="210" y="329">stream on &lt;ksps&gt; [core pinsel]</text>
<rect class="bx s-app" x="450" y="290" width="280" height="56" rx="4"/>
<circle class="st-tested" cx="719" cy="301" r="5"><title>functionally tested on silicon with this version (at 7b16260 - HARDWARE-LOG 2026-09-29: 7b16260 flashed on the EV74H48A (COM26) - siggen/stream on-off/grab cycles, 76-cycle hunt, the user&#x27;s GUI session)</title></circle>
<text class="t" x="460" y="308">routing_apply()</text>
<text class="s" x="460" y="322">→ acq_chain_setup_input()</text>
<text class="s" x="460" y="336">DMA off, cores off, clock, cores on, DMA anew</text>
