<rect class="bx s-cli" x="700" y="390" width="250" height="56" rx="4"/>
<circle class="st-pending" cx="939" cy="401" r="5"><title>not tested with this version yet (changed since it was tested at 7b16260)</title></circle>
<text class="t" x="710" y="408">gui_link_stream_grab()</text>
<text class="s" x="710" y="422">freeze a pair → frame_send()</text>
<text class="s" x="710" y="436">→ release; the stream runs on</text>
<rect class="bx s-app" x="980" y="390" width="170" height="56" rx="4"/>
