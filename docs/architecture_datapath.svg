<text class="s" x="790" y="322">dma.c · + _DMA1Interrupt</text>
<text class="s" x="790" y="336">46 / 41 instr.</text>
<rect class="bx s-app" x="980" y="290" width="170" height="56" rx="4"/>
<circle class="st-pending" cx="1139" cy="301" r="5"><title>not tested with this version yet (changed since it was tested at 7b16260)</title></circle>
